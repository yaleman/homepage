<!doctype html>
<html>
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>{{title}}</title>
        <link rel="manifest" href="/manifest.webmanifest" />
        <meta name="theme-color" content="#990099" />
        <link rel="shortcut icon" href="/favicon.ico" type="image/x-icon" />
        <link rel="icon" href="/favicon.ico" type="image/x-icon" />
        <link rel="icon" href="{{favicon}}" sizes="any" type="image/svg+xml" />
        <link rel="stylesheet" href="/static/css/homepage.css" />
        <script src="/static/js/homepage.js" defer></script>
    </head>
    <body>
        <main class="page-shell">
            <header class="page-header">
                <span class="page-title">{{title}}</span>
                <form class="search-form" action="https://duckduckgo.com/">
                    <input
                        type="search"
                        name="q"
                        id="search"
                        autofocus
                        class="search-input"
                        placeholder="Search..."
                        aria-label="Search"
                    />
                </form>
            </header>

            {% block content %}
            <div class="links-grid" aria-label="Links">
                {% for link in links %}
                <div
                    class="link-item"
                    id="link-{{ link.id }}"
                    data-title="{{ link.title }}"
                >
                    <a href="{{ link.url }}" {% if open_in_new_tab %}target="_blank"
                        {% endif %} class="link-card link-card--{{ link.colour }}" rel="noreferrer">
                        <img
                            src="/images/{{link.icon}}"
                            class="link-icon"
                            alt="{{ link.title }}"
                        />
                        <span class="link-title">{{ link.title }}</span>
                    </a>
                </div>
                {% endfor %}
            </div>
            {% endblock %}
        </main>
    </body>
</html>
