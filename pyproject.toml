[project]
name = "homepage"
version = "0.0.5"
description = "Home Page"
authors = [{ name = "James Hogkinson", email = "james@terminaloutcomes.com" }]
requires-python = "<4.0,>=3.13"
dependencies = [
    "pydantic>=2.13.4",
    "fastapi>=0.136.1",
    "Jinja2>=3.1.6",
    "loguru>=0.7.3",
    "prometheus-fastapi-instrumentator>=7.1.0",
    "pydantic-settings>=2.14.1",
    "questionary>=2.1.1",
    "click>=8.3.3",
    "validators>=0.35.0",
    "requests>=2.34.2",
    "uvicorn[standard]>=0.47.0",
]
readme = "README.md"

[project.license]
text = "MIT"

[project.scripts]
homepage = "homepage.__main__:cli"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pylint-pydantic>=0.4.1",
    "httpx>=0.28.1",
    "ruff>=0.15.14",
    "types-click>=7.1.8",
    "types-requests>=2.33.0.20260518",
    "pytest-cov>=7.1.0",
    "ty>=0.0.38",
    "coveralls>=4.1.0",
    "coverage>=7.14.0",
    "pytest-playwright>=0.8.0",
]

[tool.pylint.MASTER]
max-line-length = 200
extension-pkg-whitelist = "pydantic"
load-plugins = "pylint_pydantic"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
